# Configuracao do talkedit.
# Este arquivo vale para todos os videos. Linhas que comecam com # sao comentarios.
# Para mudar uma opcao so numa execucao, use: talkedit editar video.mp4 --set ritmo.ritmo=acelerado

# Estilo pronto: "dinamico" (padrao) ou "natural". Pode ser o nome de um estilo seu
# salvo em ~/.talkedit/estilos/<nome>.toml.
estilo = "dinamico"

[audio]
# Limpeza da voz: "desligado", "leve", "normal" (padrao) ou "forte".
limpeza = "normal"
# Volume final. -14 e o padrao do YouTube, Reels e TikTok. Nao mude se nao souber.
volume_alvo_lufs = -14

[transcricao]
# Idioma falado no video.
idioma = "pt"
# Palavras que a transcricao costuma errar: seu nome, marcas, termos tecnicos.
palavras_dificeis = []

[editora]
# Regras suas para a IA editora, em portugues normal. Valem para todos os videos.
# Exemplo: regras = ["nunca corte quando eu mostro um produto na camera"]
regras = []

# O ritmo e a postura da editora vem do estilo. Para mudar so isso, tire o # da linha:
# [ritmo]
# ritmo = "dinamico"   # "natural", "dinamico" ou "acelerado"

[modelos]
# Modelo de IA de cada funcao, pelo nome no OpenRouter (https://openrouter.ai/models).
transcricao = "elevenlabs/scribe-v2"
editora = "google/gemini-4-argon"
revisora = "google/gemini-3.5-flash-lite"

[render]
# Qualidade do video final: 18 fica igual ao original a olho. Numero menor = arquivo maior.
qualidade_crf = 18
# Velocidade do render: "fast" fica pronto antes, "slow" gera arquivo menor.
velocidade_x264 = "medium"
