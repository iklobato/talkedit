[project]
name = "talkedit"
version = "0.1.0"
description = "Editor de video com IA para talking head"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.scripts]
talkedit = "talkedit.cli:CommandLine.entry"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkedit"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = "tests"

[tool.pydantic-mypy]
init_forbid_extra = true
